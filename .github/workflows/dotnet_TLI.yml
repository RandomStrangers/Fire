name: Build dotnet TLI
on:
  push:
  workflow_dispatch:
  schedule:
    # Every day at 12am
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.ref }}-dotnet-TLI
  cancel-in-progress: true

jobs:
#============================================
# ============== .NET 8.0 BUILD =============
# ===========================================
  build-dotnet8:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore TLI/FlamesTLI_dotnet8.csproj
      - name: Build
        id: compile
        run: |
          dotnet build TLI/FlamesTLI_dotnet8.csproj --no-restore
        
      - uses: ./.github/actions/notify_failure
        if: ${{ always() && steps.compile.outcome == 'failure' }}
        with:
          NOTIFY_MESSAGE: 'Failed to compile Flames dotnet TLI build!'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
          
      - uses: ./.github/actions/notify_success
        if: ${{ always() && steps.compile.outcome == 'success' }}
        with:
          SOURCE_FILE: 'TLI/bin/Debug/net8.0'
          DEST_NAME: 'Flames-net8.0'
          NOTIFY_MESSAGE: 'Successfully compiled Flames dotnet TLI build.'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
          DELETE_AFTER: '1'
          
      # publish standalone windows binaries
      - name: Publish-win64
        run: dotnet publish TLI/FlamesTLI_standalone8.csproj -r win-x64 --self-contained
          
      - uses: ./.github/actions/notify_success
        if: ${{ always() && steps.compile.outcome == 'success' }}
        with:
          SOURCE_FILE: 'TLI/bin/Debug/net8.0/win-x64/publish'
          DEST_NAME: 'Flames-win64-standalone'
          NOTIFY_MESSAGE: 'Successfully compiled Flames Windows 64-bit standalone TLI build.'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
          DELETE_AFTER: '1'

          
      # publish standalone linux binaries
      - name: Publish-linux64
        run: dotnet publish TLI/FlamesTLI_standalone8.csproj -r linux-x64 --self-contained
          
      - uses: ./.github/actions/notify_success
        if: ${{ always() && steps.compile.outcome == 'success' }}
        with:
          SOURCE_FILE: 'TLI/bin/Debug/net8.0/linux-x64/publish'
          DEST_NAME: 'Flames-linux64-standalone'
          NOTIFY_MESSAGE: 'Successfully compiled Flames Linux 64-bit standalone TLI build.'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
          DELETE_AFTER: '1'
